<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#11203f" />
      <stop offset="100%" stop-color="#060912" />
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" />
      <stop offset="55%" stop-color="#f5b94c" />
      <stop offset="100%" stop-color="#c97e1b" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="96" fill="url(#sun)" />
    <g stroke="#f5b94c" stroke-width="14" stroke-linecap="round" opacity="0.92">
      <line x1="256" y1="80" x2="256" y2="128" />
      <line x1="256" y1="384" x2="256" y2="432" />
      <line x1="80" y1="256" x2="128" y2="256" />
      <line x1="384" y1="256" x2="432" y2="256" />
      <line x1="131" y1="131" x2="165" y2="165" />
      <line x1="347" y1="347" x2="381" y2="381" />
      <line x1="131" y1="381" x2="165" y2="347" />
      <line x1="347" y1="165" x2="381" y2="131" />
    </g>
  </g>
</svg>
